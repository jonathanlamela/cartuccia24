{% extends "layout.html" %}
{% load i18n static %}

{% block title %}Cambia password{% endblock %}

{% block content %}

    {% if message %}
        <div class="alert alert-success">
            {{ message }}
        </div>
    {% endif %}
    <div class="panel panel-default">
            <div class="panel-heading">
                Recupero password Account
            </div>
            <div class="panel-body">
               <form class="form form-horizontal col-md-4" method="POST" action="/recupera/password/">
                    {% csrf_token %}
                   <div class="control-group">
                       <label>Email:</label>
                       <input type="email" name="{{ form.email.name }}" class="form-control"/>
                       <span class="help-block">{{ form.email.errors }}</span>
                   </div>
                   </br>
                   <div class="control-group">
                        <input type="submit" class="btn btn-success" value="Recupera"/>
                   </div>
                </form>
            </div>
        </div>

{% endblock %}
