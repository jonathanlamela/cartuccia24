{% extends "admin/base_site.html" %}

{% block content %}

<form action="" method="post">

    {% csrf_token %}
    {{ prodotti_form }}

    <p>I prodotti verrano aggiunti ai modelli:</p>

    <div style="display: none">
        {{ modelli }}
    </div>

    <ul>
    {% for modello in modelli %}
       <li>{{ modello.marca.nome }} {{ modello.nome }}</li>
    {% endfor %}
    </ul>

    <input type="hidden" name="action" value="copia_prodotti_da_stampante" />
    <input type="submit" name="apply" value="Aggiungi prodotti" />
</form>

{% endblock %}
