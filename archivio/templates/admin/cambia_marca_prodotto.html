{% extends "admin/base_site.html" %}

{% block content %}

<form action="" method="post">

    {% csrf_token %}
    {{ marca_form }}

    <p>La marca verrà cambiata ai modelli:</p>

     <div style="display: none">
        {{ modelli }}
    </div>

    <ul>
    {% for modello in modelli %}
       <li>{{ modello.marca.nome }} {{ modello.nome }}</li>
    {% endfor %}
    </ul>

    <input type="hidden" name="action" value="cambia_marca_prodotto" />
    <input type="submit" name="apply" value="Cambia marca" />
</form>

{% endblock %}
