{% extends "admin/base_site.html" %}

{% block content %}

<form action="" method="post">

    {% csrf_token %}
    {{ colori_form }}

    <p>Il colore verrà cambiato ai modelli:</p>

    <div style="display: none">
        {{ modelli }}
    </div>

    <ul>
    {% for modello in modelli %}
       <li>{{ modello.nome }}</li>
    {% endfor %}
    </ul>

    <input type="hidden" name="action" value="cambia_colore_prodotto" />
    <input type="submit" name="apply" value="Cambia colore" />
</form>

{% endblock %}
